[package]
name = "monade-core"
description = "The core of the Monade: words, point 0, specifications, sizes, addresses, the generated space, counters per bit. No floating point."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Exposes the slow reference implementations (the oracle) outside unit tests,
# for the fuzz targets and for other crates' tests. Never used by the engine.
oracle = []

[dependencies]
# The hash of the generated space (version 1). `pure`: Rust only, no C or assembly
# to build, the same on Windows and Linux.
blake3 = { version = "1.8", default-features = false, features = ["pure", "std"] }

[dev-dependencies]
proptest = "1.12"

[lints]
workspace = true
