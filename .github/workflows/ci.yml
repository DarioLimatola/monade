name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fmt, clippy -D warnings, no floating point in monade-core, tests debug + release
      - run: cargo all

  fuzz:
    name: fuzz (nightly, Linux)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run read_logs -- -max_total_time=600
