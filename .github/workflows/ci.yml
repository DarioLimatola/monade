name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml; rustup installs it on first use.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmt, clippy -D warnings, no floating point in monade-core, tests debug + release
      - run: cargo all
      # The Python tools (outside the mind): uv installs Python and the packages.
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project tools python -m unittest discover -s tools/tests

  fuzz:
    name: fuzz (nightly, Linux)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run read_logs -- -max_total_time=600
