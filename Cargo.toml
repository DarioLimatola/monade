[workspace]
resolver = "2"
members = ["crates/monade-core", "crates/monade-run", "crates/xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "warn"
