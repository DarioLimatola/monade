[workspace]
resolver = "2"
members = ["crates/monade-core", "crates/monade-run", "crates/xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.4.2"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "warn"

# The hash is fast only when optimised; optimise it even in debug builds.
[profile.dev.package.blake3]
opt-level = 3
